  url_launcher: ^6.2.0
  file_picker: ^11.0.0
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.4
  speech_to_text: ^7.3.0
  google_mlkit_text_recognition: ^0.15.1
  path_provider: ^2.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
