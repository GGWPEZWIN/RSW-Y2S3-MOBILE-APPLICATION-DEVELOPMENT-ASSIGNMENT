name: assignment
description: "Y2S3-mobile-application-assignment-Job-application-app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter

  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_database: ^12.2.0
  firebase_storage: ^13.2.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.0.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^21.0.0
