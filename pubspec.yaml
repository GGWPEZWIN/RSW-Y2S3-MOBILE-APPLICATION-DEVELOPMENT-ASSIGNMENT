name: assignment
description: "Y2S3-mobile-application-assignment-Job-application-app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  firebase_auth: ^4.17.0
  firebase_database: ^10.2.2
  firebase_storage: ^11.3.0
  cloud_firestore: ^4.7.0
  google_sign_in: ^6.1.4
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.3
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.2.0
  file_picker: 8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/homedeco.png
    - assets/icons/JobBuddyLogo.png
    - assets/icons/LoginPic.png
    - assets/icons/google.webp
    - assets/icons/email.png
    - assets/icons/searchbarnavdeco.png